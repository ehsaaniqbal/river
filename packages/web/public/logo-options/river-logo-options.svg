<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" role="img" aria-label="River logo options">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06110d"/>
      <stop offset="1" stop-color="#020504"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff0aa"/>
      <stop offset=".5" stop-color="#e8c96a"/>
      <stop offset="1" stop-color="#8f7430"/>
    </linearGradient>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#173627"/>
      <stop offset=".55" stop-color="#08150f"/>
      <stop offset="1" stop-color="#020604"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.91 0 1 0 0 0.79 0 0 1 0 0.42 0 0 0 .55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label { fill: #8ba898; font: 500 20px Inter, system-ui, sans-serif; letter-spacing: .14em; }
      .name { fill: #f5f0e8; font: 42px Georgia, serif; }
      .note { fill: #8ba898; font: 18px Inter, system-ui, sans-serif; }
      .tile { fill: rgba(255,255,255,.035); stroke: rgba(245,240,232,.12); }
    </style>
  </defs>

  <rect width="1440" height="960" fill="url(#bg)"/>
  <path d="M0 165H1440M0 320H1440M0 475H1440M0 630H1440M0 785H1440M210 0V960M450 0V960M690 0V960M930 0V960M1170 0V960" stroke="#f5f0e8" stroke-opacity=".035"/>

  <text x="72" y="82" class="name">River mark directions</text>
  <text x="72" y="119" class="note">Six favicon-ready logo concepts. Pick the feeling, not the final polish.</text>

  <!-- Option 01 -->
  <g transform="translate(72 170)">
    <rect class="tile" width="390" height="260" rx="18"/>
    <text x="26" y="42" class="label">01  MONOGRAM</text>
    <g transform="translate(58 78)">
      <rect width="112" height="112" rx="24" fill="url(#felt)" stroke="#f5f0e8" stroke-opacity=".14"/>
      <path d="M36 85V30h25c20 0 28 10 28 23 0 12-8 21-22 23l26 32" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
      <path d="M36 58h25" stroke="#f5f0e8" stroke-opacity=".28" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="196" y="128" class="name">River</text>
    <text x="196" y="160" class="note">Luxury serif R, easiest favicon read.</text>
  </g>

  <!-- Option 02 -->
  <g transform="translate(525 170)">
    <rect class="tile" width="390" height="260" rx="18"/>
    <text x="26" y="42" class="label">02  RIVER LINE</text>
    <g transform="translate(58 78)">
      <rect width="112" height="112" rx="24" fill="url(#felt)" stroke="#f5f0e8" stroke-opacity=".14"/>
      <path d="M23 78C44 42 70 76 91 34" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" filter="url(#softGlow)"/>
      <path d="M24 91C47 61 69 88 94 57" fill="none" stroke="#f5f0e8" stroke-opacity=".26" stroke-width="3" stroke-linecap="round"/>
      <circle cx="88" cy="34" r="5" fill="#f5f0e8"/>
    </g>
    <text x="196" y="128" class="name">River</text>
    <text x="196" y="160" class="note">Abstract river path, less poker literal.</text>
  </g>

  <!-- Option 03 -->
  <g transform="translate(978 170)">
    <rect class="tile" width="390" height="260" rx="18"/>
    <text x="26" y="42" class="label">03  TABLE RAIL</text>
    <g transform="translate(58 78)">
      <rect width="112" height="112" rx="24" fill="url(#felt)" stroke="#f5f0e8" stroke-opacity=".14"/>
      <path d="M23 63C23 38 40 24 61 24h24c7 0 12 5 12 12v41c0 8-6 14-14 14H42C31 91 23 80 23 63Z" fill="none" stroke="url(#gold)" stroke-width="7" filter="url(#softGlow)"/>
      <path d="M39 46h43M39 62h28" stroke="#f5f0e8" stroke-opacity=".38" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="196" y="128" class="name">River</text>
    <text x="196" y="160" class="note">Table edge, feels product-specific.</text>
  </g>

  <!-- Option 04 -->
  <g transform="translate(72 500)">
    <rect class="tile" width="390" height="260" rx="18"/>
    <text x="26" y="42" class="label">04  SPADE CUT</text>
    <g transform="translate(58 78)">
      <rect width="112" height="112" rx="24" fill="url(#felt)" stroke="#f5f0e8" stroke-opacity=".14"/>
      <path d="M56 24C39 42 28 52 28 66c0 13 10 22 22 18-2 8-6 14-11 20h34c-5-6-9-12-11-20 12 4 22-5 22-18 0-14-11-24-28-42Z" fill="url(#gold)" filter="url(#softGlow)"/>
      <path d="M56 34v48" stroke="#06110d" stroke-opacity=".72" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text x="196" y="128" class="name">River</text>
    <text x="196" y="160" class="note">Poker-forward, sharp at tiny sizes.</text>
  </g>

  <!-- Option 05 -->
  <g transform="translate(525 500)">
    <rect class="tile" width="390" height="260" rx="18"/>
    <text x="26" y="42" class="label">05  CHIP SEAL</text>
    <g transform="translate(58 78)">
      <rect width="112" height="112" rx="24" fill="url(#felt)" stroke="#f5f0e8" stroke-opacity=".14"/>
      <circle cx="56" cy="56" r="37" fill="none" stroke="url(#gold)" stroke-width="8" filter="url(#softGlow)"/>
      <circle cx="56" cy="56" r="23" fill="none" stroke="#f5f0e8" stroke-opacity=".22" stroke-width="2"/>
      <path d="M43 66C49 49 61 64 70 46" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="196" y="128" class="name">River</text>
    <text x="196" y="160" class="note">Casino chip seal, premium badge feel.</text>
  </g>

  <!-- Option 06 -->
  <g transform="translate(978 500)">
    <rect class="tile" width="390" height="260" rx="18"/>
    <text x="26" y="42" class="label">06  WORDMARK ONLY</text>
    <g transform="translate(58 78)">
      <rect width="112" height="112" rx="24" fill="#06110d" stroke="#f5f0e8" stroke-opacity=".14"/>
      <text x="56" y="73" text-anchor="middle" fill="url(#gold)" font-family="Georgia, serif" font-size="60" filter="url(#softGlow)">R</text>
      <path d="M31 86h50" stroke="#f5f0e8" stroke-opacity=".22" stroke-width="2"/>
    </g>
    <text x="196" y="128" class="name">River</text>
    <text x="196" y="160" class="note">Quiet editorial, least icon-y.</text>
  </g>
</svg>
